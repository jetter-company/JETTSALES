# Publica o Cockpit PA no Firebase (Hosting + regras e índices do Firestore).
# Precisa de dois segredos no GitHub (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT  conteúdo do arquivo .json da conta de serviço do Firebase
#   GEMINI_API_KEY            (opcional) chave do Gemini para o briefing com IA
name: Publicar no Firebase

on:
  push:
    branches: [claude/esse-prompt-md-hb309i, main, master]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Conferir segredo do Firebase
        id: segredo
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT não configurado. Build ok, publicação pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/conta-servico.json"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar regras, índices e site
        if: steps.segredo.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/conta-servico.json
        run: npx firebase-tools@14 deploy --only firestore,hosting --non-interactive --force
